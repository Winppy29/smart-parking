<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking — עמדת שומר</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 24px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card); padding: 20px 28px; border-radius: 14px;
            border: 1px solid #334155; margin-bottom: 24px;
        }
        header h1 { font-size: 24px; display: flex; align-items: center; gap: 10px; }
        .badge { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }

        /* מונה מקומות חניה (הפיצ'ר הייחודי) */
        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card); padding: 20px; border-radius: 14px;
            border: 1px solid #334155; text-align: center;
        }
        .stat-value { font-size: 36px; font-weight: 800; margin: 8px 0; }
        .stat-label { color: var(--muted); font-size: 14px; font-weight: 600; }
        .free-color { color: var(--green); }
        .busy-color { color: var(--yellow); }

        .progress-wrapper {
            background: var(--card); padding: 16px 24px; border-radius: 14px;
            border: 1px solid #334155; margin-bottom: 24px;
        }
        .progress-bar-bg { background: #334155; height: 14px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: var(--green); width: 60%; transition: 0.3s ease; }

        .alert-full {
            display: none; background: rgba(239, 68, 68, 0.2); border: 2px solid var(--red);
            color: #fca5a5; padding: 16px; border-radius: 12px; text-align: center;
            font-weight: bold; font-size: 18px; margin-bottom: 24px;
        }

        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        button {
            cursor: pointer; border: none; padding: 12px 20px; border-radius: 10px;
            font-weight: 600; font-size: 14px; transition: 0.2s;
        }
        .btn-add { background: var(--accent); color: #0f172a; }
        .btn-add:hover { background: #7dd3fc; }
        .btn-add:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        .btn-leave { background: rgba(239, 68, 68, 0.15); color: var(--red); width: 100%; margin-top: 12px; }
        .btn-leave:hover { background: var(--red); color: white; }

        /* כרטיסי רכבים */
        .cars-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .car-card {
            background: var(--card); border-radius: 14px; overflow: hidden;
            border: 1px solid #334155; display: flex; flex-direction: column;
        }
        .car-img {
            width: 100%; height: 180px; object-fit: cover; background: #020617;
            border-bottom: 1px solid #334155;
        }
        .car-info { padding: 18px; }
        .plate {
            display: inline-block; background: #facc15; color: #000; font-weight: 900;
            padding: 4px 12px; border-radius: 6px; border: 2px solid #000;
            font-size: 18px; letter-spacing: 1px; margin-bottom: 10px;
            direction: ltr;
        }
        .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚘 מערכת ניהול חניון חכם</h1>
            <span class="badge">● מצלמת IoT + שרת אחסון: פעיל</span>
        </header>

        <!-- מונה מקומות חניה -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">סה״כ מקומות חניה</div>
                <div class="stat-value" id="total-spots">5</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">תפוסים</div>
                <div class="stat-value busy-color" id="occupied-spots">3</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">פנויים</div>
                <div class="stat-value free-color" id="free-spots">2</div>
            </div>
        </div>

        <div class="progress-wrapper">
            <div style="display: flex; justify-content: space-between; font-size: 14px;">
                <span>תפוסת החניון</span>
                <span id="percent-text">60%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="alert-full" id="full-alert">
            ⛔ שימו לב: החניון מלא לחלוטין! הכניסה סגורה.
        </div>

        <div class="controls">
            <h2>רכבים בחניון (תמונות משרת Apache Storage)</h2>
            <button class="btn-add" id="add-car-btn" onclick="simulateEntry()">+ הדמיית כניסת רכב (מצלמה)</button>
        </div>

        <div class="cars-grid" id="cars-container"></div>
    </div>

    <script>
        const MAX_SPOTS = 5;
        // כתובת שרת האחסון (Apache Storage Server)
        const STORAGE_URL = "http://localhost:8081";

        let parkedCars = [
            { id: 1, plate: "12-345-67", time: "08:15", image: `${STORAGE_URL}/car1.jpg` },
            { id: 2, plate: "89-012-34", time: "09:40", image: `${STORAGE_URL}/car2.jpg` },
            { id: 3, plate: "55-777-88", time: "10:12", image: `${STORAGE_URL}/car3.jpg` }
        ];

        const extraSamples = [
            { plate: "44-123-99", image: `${STORAGE_URL}/car1.jpg` },
            { plate: "71-888-00", image: `${STORAGE_URL}/car2.jpg` }
        ];

        function renderDashboard() {
            const occupied = parkedCars.length;
            const free = MAX_SPOTS - occupied;
            const percent = Math.round((occupied / MAX_SPOTS) * 100);

            document.getElementById("occupied-spots").innerText = occupied;
            document.getElementById("free-spots").innerText = free;
            document.getElementById("percent-text").innerText = `${percent}%`;

            const fill = document.getElementById("progress-fill");
            fill.style.width = `${percent}%`;
            fill.style.background = free === 0 ? "var(--red)" : (free <= 2 ? "var(--yellow)" : "var(--green)");

            const alertBox = document.getElementById("full-alert");
            const addBtn = document.getElementById("add-car-btn");

            if (free === 0) {
                alertBox.style.display = "block";
                addBtn.disabled = true;
            } else {
                alertBox.style.display = "none";
                addBtn.disabled = false;
            }

            const container = document.getElementById("cars-container");
            container.innerHTML = "";

            parkedCars.forEach(car => {
                const card = document.createElement("div");
                card.className = "car-card";
                card.innerHTML = `
                    <img class="car-img" src="${car.image}" alt="רכב ${car.plate}">
                    <div class="car-info">
                        <div class="plate">${car.plate}</div>
                        <div class="meta">🕒 שעת כניסה: <b>${car.time}</b></div>
                        <div class="meta">📡 מקור תמונה: Apache Storage (:8081)</div>
                        <button class="btn-leave" onclick="releaseCar(${car.id})">שחרור רכב מהחניון</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function simulateEntry() {
            if (parkedCars.length >= MAX_SPOTS) return;
            const sample = extraSamples[parkedCars.length % extraSamples.length];
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

            parkedCars.push({
                id: Date.now(),
                plate: sample.plate,
                time: timeStr,
                image: sample.image
            });
            renderDashboard();
        }

        function releaseCar(id) {
            parkedCars = parkedCars.filter(car => car.id !== id);
            renderDashboard();
        }

        renderDashboard();
    </script>
</body>
</html>
